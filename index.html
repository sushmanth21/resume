<!DOCTYPE html>

<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta id="meta-description" name="description" content="">

    <meta id="meta-author" name="author" content="">

    <title id="page-title"></title>

    <link rel="stylesheet" href="style.css">


</head>

<body>


    <header class="header">

        <div class="identity">

            <h1 id="profile-name" class="name">
            </h1>

            <span id="profile-role" class="role">
            </span>

        </div>

        <div class="actions">

            <a id="open-button" class="button open-button" href="#" target="_blank" rel="noopener">
            </a>

            <a id="download-button" class="button download-button" href="#" download>
            </a>

        </div>

    </header>

    <main class="viewer">

        <div class="pdf-container">

            <iframe id="pdf-viewer" title="Resume PDF">
            </iframe>

        </div>

    </main>

    <script>

        fetch("config.json")
            .then(response => {

                if (!response.ok) {
                    throw new Error("Unable to load config.json");
                }

                return response.json();
            })
            .then(config => {

                /* =========================
                   META
                ========================= */

                document.title = config.meta.title;

                document
                    .getElementById("meta-description")
                    .setAttribute(
                        "content",
                        config.meta.description
                    );

                document
                    .getElementById("meta-author")
                    .setAttribute(
                        "content",
                        config.meta.author
                    );


                /* =========================
                   PROFILE
                ========================= */

                document
                    .getElementById("profile-name")
                    .textContent = config.profile.name;

                document
                    .getElementById("profile-role")
                    .textContent = config.profile.role;


                /* =========================
                   RESUME
                ========================= */

                const resumeFile = config.resume.file;


                /* =========================
                   BUTTONS
                ========================= */

                const openButton =
                    document.getElementById("open-button");

                const downloadButton =
                    document.getElementById("download-button");

                openButton.textContent =
                    config.buttons.open;

                downloadButton.textContent =
                    config.buttons.download;

                openButton.href = resumeFile;

                downloadButton.href = resumeFile;


                /* =========================
                   PDF VIEWER
                ========================= */

                document
                    .getElementById("pdf-viewer")
                    .src = resumeFile;

            })
            .catch(error => {

                console.error(error);

                document
                    .getElementById("profile-name")
                    .textContent =
                    "Unable to load resume";

            });

    </script>


</body>

</html>
