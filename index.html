<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            height: 60px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .download {
            text-decoration: none;
            background: #333333;
            color: white;
            padding: 10px 16px;
            border-radius: 5px;
            font-size: 14px;
        }

        .pdf-container {
            height: calc(100vh - 60px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="title">Sushmanth Chinthala Boyina</div>

        <a class="download"
           href="Sushmanth_Chinthala_Boyina_Resume.pdf"
           target="_blank"
           download>
            Download Resume
        </a>
    </div>

    <div class="pdf-container">
        <iframe src="Sushmanth_Chinthala_Boyina_Resume.pdf"></iframe>
    </div>

</body>
</html>
